
<!DOCTYPE html>
<html>
<head>
    <title>Lab 8 - User Information Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>User Information Form</h1>
        <p>Please enter your details below.</p>

        <form id="userForm">

            <label>Full Name:</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label>Gender:</label>
            <div class="gender">
                <input type="radio" name="gender" value="Male" required> Male
                <input type="radio" name="gender" value="Female"> Female
                <input type="radio" name="gender" value="Other"> Other
            </div>

            <label>Mobile Number:</label>
            <input type="tel" id="mobile" placeholder="Enter mobile number"
                   pattern="[0-9]{10}" title="Enter a 10-digit mobile number" required>

            <label>Email ID:</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>City:</label>
            <input type="text" id="city" placeholder="Enter your city" required>

            <label>State:</label>
            <input type="text" id="state" placeholder="Enter your state" required>

            <label>Country:</label>
            <input type="text" id="country" placeholder="Enter your country" required>

            <button type="submit">Submit Information</button>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
